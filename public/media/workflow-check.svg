<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 310" role="img" aria-labelledby="title desc"><title id="title">A bounded lesson workflow</title><desc id="desc">Receive sources, draft, then check. A passing draft is ready for approval. A failed check returns to revision if the budget remains, or goes to human review if evidence is missing or the budget is exhausted.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="m0 0 8 4-8 4" fill="none" stroke="#7b8e6c" stroke-width="1.2"/></marker></defs><rect width="900" height="310" rx="14" fill="#f3f5ec"/><g fill="none" stroke="#7b8e6c" stroke-width="1.5" marker-end="url(#arrow)"><path d="M175 100h52M380 100h52M585 100h62"/><path d="M507 132v54H306v-54"/><path d="M585 112h28v119h34"/></g><g fill="#fcfcf7" stroke="#ced8c2"><rect x="25" y="68" width="150" height="64" rx="9"/><rect x="230" y="68" width="150" height="64" rx="9"/><rect x="435" y="68" width="150" height="64" rx="9"/><rect x="650" y="68" width="220" height="64" rx="9" fill="#e2ebd8"/><rect x="650" y="198" width="220" height="64" rx="9" fill="#efe3d5"/></g><g font-family="sans-serif" fill="#45573c" font-size="17" text-anchor="middle"><text x="100" y="96">Receive sources</text><text x="100" y="118" font-size="13" fill="#7b8e6c">and task</text><text x="305" y="107">Draft lesson</text><text x="510" y="107">Check evidence</text><text x="760" y="107">Ready for approval</text><text x="760" y="237">Human review</text></g><g font-family="sans-serif" font-size="12" fill="#859775"><text x="608" y="56">PASS</text><text x="315" y="214">FAIL → REVISE IF BUDGET REMAINS</text><text x="445" y="283">Missing evidence or budget exhausted → review</text><text x="26" y="31" font-size="10" letter-spacing="2">UNDERSTAND THE ROUTE BEFORE AUTOMATING IT</text></g></svg>
